services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@1"
    platform: "linux/amd64"
    ports:
      - "1433:1433"

  airflow:
    image: apache/airflow:3.3.0
    container_name: airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-microsoft-mssql==4.7.0"
      AIRFLOW_CONN_DATING_SQL: "mssql://SA:Password%401@sql:1433/datingdb"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: standalone
    depends_on:
      - sql